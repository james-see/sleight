name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      # Marker check instead of trusting the pipe: a failed xcodebuild used to
      # hide behind `|| true` when grep had nothing to pass through.
      - name: Build and test
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild test \
            -project sleight.xcodeproj \
            -scheme sleight \
            -destination 'platform=macOS' 2>&1 \
            | tee build.log | grep -vE "autoShortcut|Connection|synchronousRemoteObjectProxy" || true
          grep -q "TEST SUCCEEDED" build.log || { echo "::error::tests did not succeed"; exit 1; }