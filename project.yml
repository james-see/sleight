name: sleight
options:
  bundleIdPrefix: us.jamescampbell
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ARCHS: arm64
targets:
  sleight:
    type: application
    platform: macOS
    sources: [sleight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.jamescampbell.sleight
        INFOPLIST_KEY_NSCameraUsageDescription: "Sleight tracks your hands to play MIDI instruments."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  sleightTests:
    type: bundle.unit-test
    platform: macOS
    sources: [sleightTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: sleight
schemes:
  sleight:
    build:
      targets:
        sleight: all
        sleightTests: [test]
    test:
      targets: [sleightTests]